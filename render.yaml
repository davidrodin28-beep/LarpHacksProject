# One Python Web Service serves the allowlisted website and the sport API.
# Public URL: https://larphacksproject.onrender.com. Supabase handles accounts.
services:
  - type: web
    name: larphacksproject
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python3 scripts/build_static.py
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SPORTGEN_API_KEY
        sync: false   # build.nvidia.com key for the "best" engine (Nemotron 3 Ultra)
      - key: SPORTGEN_FAST_API_KEY
        sync: false   # optional second key for the "fast" engine (Nemotron 3.5 Lightning)
