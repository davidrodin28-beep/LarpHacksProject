# Supabase handles accounts; Render serves only the allowlisted static build.
services:
  - type: web
    name: stillwatch
    runtime: static
    buildCommand: python3 scripts/build_static.py
    staticPublishPath: ./dist
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
    headers:
      - path: /auth-config.json
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: redirect
        source: /login
        destination: /login.html
      - type: redirect
        source: /signup
        destination: /signup.html
